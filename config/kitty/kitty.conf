font_family 0xProto
font_size 11.5

background_opacity 0.90
background_blur 1

window_padding_width 10
confirm_os_window_close 0

cursor_shape beam
cursor_beam_thickness 1.8

# ARCHMAC Galaxy — animated text cursor
# Trail appears on meaningful cursor jumps without smearing normal typing.
cursor_trail 120
cursor_trail_decay 0.12 0.35
cursor_trail_start_threshold 3 2
cursor_stop_blinking_after 12

# ARCHMAC Galaxy — animated text cursor
# Trail appears on meaningful cursor jumps without smearing normal typing.
cursor_trail 100
cursor_trail_decay 0.10 0.30
cursor_trail_start_threshold 3 2
cursor_stop_blinking_after 12

# ARCHMAC — fast terminal capture
# Ctrl+Shift+A copies the complete screen + scrollback to clipboard.

# ARCHMAC — fast terminal capture
# Ctrl+Shift+A copies the complete screen + scrollback to clipboard.
map ctrl+shift+a launch --stdin-source=@screen_scrollback --type=background wl-copy
