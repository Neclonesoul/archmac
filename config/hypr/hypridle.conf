general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on

    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# ARCHMAC_GALAXY_SCREENSAVER_BEGIN
# Galaxy starts after 2 minutes of true user inactivity.
# Video/browser Wayland/DBus/systemd inhibitors suppress this listener.
listener {
    timeout = 120
    on-timeout = ~/.local/bin/archmac-screensaver-launch
    on-resume = pkill -f '[a]rchmac-screensaver' || true
    ignore_inhibit = false
}
# ARCHMAC_GALAXY_SCREENSAVER_END
